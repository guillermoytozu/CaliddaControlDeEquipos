<!DOCTYPE html>
<html>

<head>
    <title>Control de Equipos Calidda</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
</head>

<body>

    <nav>
        <ul class="lista-Nav">
            <!-- Nota: Respeté tu L mayúscula en los IDs -->
            <li><a id="Link-inicio" href="#">Inicio</a></li>
            <li><a id="Link-fotos" href="#">Inventario</a></li>
        </ul>
    </nav>
    <header id="header">
        <div class="izq"><Img src="IMG/logo.png"></div>
        <h1 class="der" id="Titulo">Bienvenidos</h1>
    </header>

    <!-- AGRUPAMOS LA VISTA INICIO -->
    <main id="vista-inicio">

        <form id="formulario-equipos">
            <section>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre">
            </section>
            <section>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Apellido">
            </section>
            <section>
                <label for="equipo">Equipo:</label>
                <input type="text" id="equipo" name="equipo" placeholder="Ej. Radio detection ">
            </section>
            <section>
                <label for="ubicacion">Ubicación:</label>
                <input type="text" id="ubicacion" name="ubicacion" placeholder="Alamcén sótano 5 ">
            </section>
            <section>
                <label for="movimiento">Movimiento:</label>
                <input type="text" id="movimiento" name="movimiento" placeholder="Ingreso / Salida">
            </section>

            <button id="boton-formulario">Enviar</button>
        </form>

        <section id="seccion-lista">
            <h2>Trazabilidad de equipos</h2>
            <table id="tabla-lista-equipos">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Equipo</th>
                        <th>Ubicación</th>
                        <th>Movimiento</th>
                        <th>Fecha</th>
                        <th>Hora</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-equipos">
                </tbody>
            </table>
        </section>

    </main>

    <!-- VISTA INVENTARIO (Oculta por defecto) -->
    <main id="vista-inventario" class="oculto">
        <section class="inventario">

        </section>
    </main>

    <footer>
        <p>Calidda - Derechos reservados</p>
        <p class="footer">2026</p>
    </footer>

    <script type="module" src="main.js"></script>
</body>

</html>

<!-- Test -->
